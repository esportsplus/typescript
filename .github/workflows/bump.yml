name: bump version
on:
  push:
    branches: '**'
  workflow_call:
    inputs:
      release-revision:
        description: Upload the post-bump SHA for a downstream native build
        type: boolean
        default: false
      patch-keywords:
        type: string
        default: fix,chore
      should-default-to-patch:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: shared-bump-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bump:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jpb06/bump-package@9ac11999a9120098fc7ae13d12dcc129f4fcd30e # reviewed latest
        with:
          minor-keywords: feat,minor,refactor
          patch-keywords: ${{ inputs.patch-keywords || 'fix,chore' }}
          should-default-to-patch: ${{ inputs.should-default-to-patch || false }}
      - name: Record release revision
        if: inputs.release-revision
        run: git rev-parse HEAD > release-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.release-revision
        with:
          name: release-revision
          path: release-sha.txt
          if-no-files-found: error
