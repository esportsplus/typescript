name: bump version
on:
  push:
    branches: '**'
  workflow_call:
permissions:
  contents: write
concurrency:
  group: shared-bump-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bump:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jpb06/bump-package@17ebfe09aceb4f746cc3dc23e82faa4a63284845 # reviewed latest
        with:
          minor-keywords: feat,minor,refactor
          patch-keywords: fix,chore
