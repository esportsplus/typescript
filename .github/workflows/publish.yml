name: publish to npm
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      node-version:
        description: Override engines.node for an exact CI runtime
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        description: Optional read token for private dependency installation
        required: false
  workflow_dispatch:
  workflow_run:
    workflows: [bump version]
    types: [completed]
concurrency:
  group: shared-npm-publish
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Resolve the post-bump branch once; verify and publish this checkout.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - name: Record release commit
        run: git rev-parse HEAD
      - name: Resolve package toolchain
        id: toolchain
        env:
          NODE_OVERRIDE: ${{ inputs.node-version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const node = process.env.NODE_OVERRIDE || pkg.engines?.node || '26.8.1';
          const manager = pkg.packageManager;
          if (manager && !/^pnpm@\d+\.\d+\.\d+(?:[-+].*)?$/.test(manager)) {
            throw new Error('packageManager must declare an exact pnpm version');
          }
          if (/[\r\n]/.test(node)) throw new Error('Invalid Node requirement');
          if (typeof pkg.version !== 'string' || /[\r\n]/.test(pkg.version)) throw new Error('Invalid package version');
          appendFileSync(process.env.GITHUB_OUTPUT, 'node=' + node + '\nlegacy-pnpm=' + (manager ? '' : '11.10.0') + '\nversion=' + pkg.version + '\n');
          if (!pkg.engines?.node && !process.env.NODE_OVERRIDE) console.log('::warning::No engines.node; using migration fallback 26.8.1');
          if (!manager) console.log('::warning::No packageManager; using migration fallback pnpm 11.10.0');
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
          version: ${{ steps.toolchain.outputs.legacy-pnpm }}
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The analyzer's findings from earlier runs; their entries are keyed by the analyzer's content,
      # so they are reused across fresh installs of the same build
      - name: Restore analyze cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.cache/@esportsplus/typescript/guard
          key: analyze-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.toolchain.outputs.version }}
          restore-keys: |
            analyze-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            analyze-${{ runner.os }}-
      - name: Lint package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --if-present run lint
      - name: Verify package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if node -e "process.exit(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).scripts?.verify ? 0 : 1)"; then
            pnpm run verify
          else
            echo "::warning::Define scripts.verify; using legacy build and test commands"
            pnpm run build
            pnpm --if-present run test
          fi
      - name: Publish verified package with OIDC
        run: pnpm publish --no-git-checks
        env:
          # Lifecycle hooks may install private dependencies; pnpm prefers OIDC for publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
